<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Покупка товара</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .bg-pink { background-color: #ffb6c1 !important; }
        .btn-pink { background-color: #ff69b4; border-color: #ff69b4; color: white; }
        .btn-pink:hover { background-color: #ff1493; color: white; }
        .navbar-brand, .nav-link { color: white !important; }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg bg-pink">
        <div class="container">
            <a class="navbar-brand" href="/">Цветочный магазин</a>
            <div class="navbar-nav">
                <a class="nav-link" href="/flowers">Цветы</a>
                <a class="nav-link" href="/bouquets">Букеты</a>
                <a class="nav-link" href="/products">Товары</a>
                <a class="nav-link active" href="/customers">Клиенты</a>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        <h2>Покупка товара для клиента: {{.Customer.Name}}</h2>
        
        {{if .Error}}
        <div class="alert alert-danger">{{.Error}}</div>
        {{end}}
        
        <div class="card mt-3">
            <div class="card-body">
                <form action="/customers/buy/{{.Customer.ID}}" method="post">
                    <div class="mb-3">
                        <label class="form-label">Товар:</label>
                        <select name="product_id" class="form-select" required>
                            {{range .Products}}
                            <option value="{{.ID}}">{{.Name}} - {{.Price}} руб.</option>
                            {{end}}
                        </select>
                    </div>
                    
                    <div class="mb-3">
                        <label class="form-label">Количество:</label>
                        <input type="number" name="quantity" value="1" min="1" max="100" class="form-control" required>
                    </div>
                    
                    <button type="submit" class="btn btn-pink">Купить</button>
                    <a href="/customers" class="btn btn-secondary">Отмена</a>
                </form>
            </div>
        </div>
    </div>
</body>
</html>
