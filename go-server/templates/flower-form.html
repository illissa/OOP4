<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>{{if .edit}}Редактировать{{else}}Добавить{{end}} цветок</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-4">
        <h2>{{if .edit}}Редактировать: {{.flower.Name}}{{else}}Добавить новый цветок{{end}}</h2>
        {{if .error}}<div class="alert alert-danger">{{.error}}</div>{{end}}
        
        <form method="POST" action="{{.action}}">
            <div class="mb-3"><label class="form-label">Название:</label><input type="text" name="name" class="form-control" value="{{.flower.Name}}" required></div>
            <div class="mb-3"><label class="form-label">Цвет:</label><input type="text" name="color" class="form-control" value="{{.flower.Color}}" required></div>
            <div class="mb-3"><label class="form-label">Цена (руб):</label><input type="number" name="price" step="0.01" class="form-control" value="{{.flower.Price}}" required></div>
            <div class="mb-3">
                <label class="form-label">Сезон:</label>
                <select name="season" class="form-select">
                    <option value="Всесезонный">Всесезонный</option>
                    <option value="Весна">Весна</option>
                    <option value="Лето">Лето</option>
                    <option value="Осень">Осень</option>
                    <option value="Зима">Зима</option>
                </select>
            </div>
            <button type="submit" class="btn btn-success">Сохранить</button>
            <a href="/flowers" class="btn btn-secondary">Отмена</a>
        </form>
    </div>
</body>
</html>
