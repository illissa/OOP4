<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Добавить клиента</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-4">
        <h2>Добавить клиента</h2>
        {{if .error}}<div class="alert alert-danger">{{.error}}</div>{{end}}
        <form method="POST" action="/customers/save">
            <div class="mb-3"><label class="form-label">Имя:</label><input type="text" name="name" class="form-control" required></div>
            <div class="mb-3"><label class="form-label">Телефон:</label><input type="text" name="phone" class="form-control"></div>
            <button type="submit" class="btn btn-success">Сохранить</button>
            <a href="/customers" class="btn btn-secondary">Отмена</a>
        </form>
    </div>
</body>
</html>
