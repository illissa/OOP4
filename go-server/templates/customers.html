<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Клиенты</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .bg-pink { background-color: #ffb6c1 !important; }
        .btn-pink { background-color: #ff69b4; border-color: #ff69b4; color: white; }
        .btn-pink:hover { background-color: #ff1493; color: white; }
        .navbar-brand, .nav-link { color: white !important; }
        .nav-link:hover { color: #ff1493 !important; }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg bg-pink">
        <div class="container">
            <a class="navbar-brand" href="/">Цветочный магазин</a>
            <div class="navbar-nav">
                <a class="nav-link" href="/flowers">Цветы</a>
                <a class="nav-link" href="/bouquets">Букеты</a>
                <a class="nav-link" href="/products">Товары</a>
                <a class="nav-link active" href="/customers">Клиенты</a>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        <h2>Управление клиентами</h2>
        
        {{if .message}}
        <div class="alert alert-success">{{.message}}</div>
        {{end}}
        
        <a href="/customers/add" class="btn btn-pink mb-3">Добавить клиента</a>

        <table class="table table-striped">
            <thead class="table-dark">
                <tr>
                    <th>ID</th>
                    <th>Имя</th>
                    <th>Телефон</th>
                    <th>Дата регистрации</th>
                    <th>Действия</th>
                </tr>
            </thead>
            <tbody>
                {{range .customers}}
                <tr>
                    <td>{{.ID}}</td>
                    <td>{{.Name}}</td>
                    <td>{{.Phone}}</td>
                    <td>{{.CreatedAt}}</td>
                    <td>
                        <a href="/customers/buy/{{.ID}}" class="btn btn-sm btn-success">Купить</a>
                        <a href="/customers/{{.ID}}/purchases" class="btn btn-sm btn-info">Покупки</a>
                        <a href="/customers/delete/{{.ID}}" class="btn btn-sm btn-danger" onclick="return confirm('Удалить клиента?')">Удалить</a>
                    </td>
                </tr>
                {{end}}
            </tbody>
        </table>
    </div>
</body>
</html>
