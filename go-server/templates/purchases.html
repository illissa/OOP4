<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Покупки</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>.bg-pink{background-color:#ffb6c1!important}</style>
</head>
<body>
    <nav class="navbar navbar-expand-lg bg-pink">
        <div class="container"><a class="navbar-brand text-white" href="/">Цветочный магазин</a></div>
    </nav>
    <div class="container mt-4">
        <h2>Все покупки</h2>
        <table class="table table-striped">
            <thead class="table-dark"><tr><th>ID</th><th>Клиент</th><th>Товар</th><th>Кол-во</th><th>Сумма</th><th>Дата</th></tr></thead>
            <tbody>
                {{range .purchases}}<tr><td>{{.ID}}</td><td>{{.CustomerName}}</td><td>{{.ProductName}}</td><td>{{.Quantity}}</td><td>{{.TotalPrice}} руб.</td><td>{{.PurchaseDate}}</td></tr>{{end}}
            </tbody>
        </table>
        {{if not .purchases}}<div class="alert alert-info">Нет покупок</div>{{end}}
    </div>
</body>
</html>
