<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Товары</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .bg-pink { background-color: #ffb6c1 !important; }
        .navbar-brand, .nav-link { color: white !important; }
        .nav-link:hover, .nav-link.active { color: #ff1493 !important; }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg bg-pink">
        <div class="container">
            <a class="navbar-brand" href="/">Цветочный магазин</a>
            <div class="navbar-nav">
                <a class="nav-link" href="/flowers">Цветы</a>
                <a class="nav-link" href="/bouquets">Букеты</a>
                <a class="nav-link active" href="/products">Товары</a>
                <a class="nav-link" href="/customers">Клиенты</a>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        <h2>Все товары</h2>
        {{if .message}}<div class="alert alert-success">{{.message}}</div>{{end}}
        
        <table class="table table-striped">
            <thead class="table-dark"><tr><th>ID</th><th>Название</th><th>Цена</th><th>Тип</th><th>В наличии</th><th>Действия</th></tr></thead>
            <tbody>
                {{range .products}}
                <tr><td>{{.ID}}</td><td>{{.Name}}</td><td>{{.Price}}</td><td>{{.ProductType}}</td><td>{{if .InStock}}Да{{else}}Нет{{end}}</td>
                    <td><a href="/products/delete/{{.ID}}" class="btn btn-sm btn-danger" onclick="return confirm('Удалить?')">Удалить</a></td></tr>
                {{end}}
            </tbody>
        </table>
    </div>
</body>
</html>
