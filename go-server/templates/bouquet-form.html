<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>{{if .edit}}Редактировать{{else}}Добавить{{end}} букет</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-4">
        <h2>{{if .edit}}Редактировать: {{.bouquet.Name}}{{else}}Добавить новый букет{{end}}</h2>
        {{if .error}}<div class="alert alert-danger">{{.error}}</div>{{end}}
        
        <form method="POST" action="{{.action}}">
            <div class="mb-3"><label class="form-label">Название:</label><input type="text" name="name" class="form-control" value="{{.bouquet.Name}}" required></div>
            <div class="mb-3"><label class="form-label">Тип упаковки:</label><input type="text" name="wrapping_type" class="form-control" value="{{.bouquet.WrappingType}}" required></div>
            <div class="mb-3"><label class="form-label">Цена (руб):</label><input type="number" name="price" step="0.01" class="form-control" value="{{.bouquet.Price}}" required></div>
            <button type="submit" class="btn btn-success">Сохранить</button>
            <a href="/bouquets" class="btn btn-secondary">Отмена</a>
        </form>
    </div>
</body>
</html>
